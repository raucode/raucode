<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="328" viewBox="0 0 1200 328" role="img" aria-labelledby="title description"><title id="title">My workflow: build, deploy and operate</title><desc id="description">Conceptual workflow: build with Rust, React and PostgreSQL; deploy with Linux, Docker and Nginx; operate with Zabbix and Grafana; observe and improve. My own server.</desc><rect width="1200" height="328" rx="14" fill="#0b1014"/><rect x="1" y="1" width="1198" height="326" rx="13" fill="none" stroke="#2b4049"/><g font-family="ui-monospace, SFMono-Regular, Consolas, monospace"><text x="28" y="46" fill="#8ce7c3" font-size="18" font-weight="400">FROM CODE TO SERVICE</text><rect x="24" y="80" width="348" height="100" rx="14" fill="#111b22" stroke="#2b4049"/><text x="46" y="121" fill="#8ce7c3" font-size="24" font-weight="700">BUILD</text><text x="46" y="153" fill="#a0b6bc" font-size="18" font-weight="400">Rust · React · PostgreSQL</text><path d="M374 130h38m-9-7 9 7-9 7" fill="none" stroke="#8ce7c3" stroke-width="2"/><rect x="416" y="80" width="348" height="100" rx="14" fill="#111b22" stroke="#2b4049"/><text x="438" y="121" fill="#78cbd6" font-size="24" font-weight="700">DEPLOY</text><text x="438" y="153" fill="#a0b6bc" font-size="18" font-weight="400">Linux · Docker · Nginx</text><path d="M766 130h38m-9-7 9 7-9 7" fill="none" stroke="#8ce7c3" stroke-width="2"/><rect x="808" y="80" width="348" height="100" rx="14" fill="#111b22" stroke="#2b4049"/><text x="830" y="121" fill="#c4a8f5" font-size="24" font-weight="700">OPERATE</text><text x="830" y="153" fill="#a0b6bc" font-size="18" font-weight="400">Zabbix · Grafana</text><path d="M980 195v25H198v-25m-7 9 7-9 7 9" fill="none" stroke="#2b4049" stroke-width="2"/><text x="392" y="249" fill="#a0b6bc" font-size="17" font-weight="400">Observe → improve → redeploy</text><text x="28" y="295" fill="#8ce7c3" font-size="16" font-weight="400">MY OWN SERVER</text><text x="235" y="295" fill="#a0b6bc" font-size="17" font-weight="400">Code, infrastructure and operations in one workflow.</text></g></svg>
